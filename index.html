<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>AquaLeafLife</title>
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#17352d;--muted:#6c7d76;--accent:#2f7d67;--accent2:#dfeee8;--line:#dbe7e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 18px;background:#102b25;color:#fff;position:sticky;top:0;z-index:4}
h1{font-size:30px;margin:0}h2{margin:0 0 8px}h3{margin:0 0 8px}.sub{color:#c8dbd4;margin-top:3px}
main{padding:18px 16px calc(30px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
button{border:0;border-radius:14px;padding:12px 15px;font-size:15px;font-weight:700;background:var(--accent);color:#fff}
button.secondary{background:var(--accent2);color:var(--ink)}button.danger{background:#f6dddd;color:#8a3535}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0;box-shadow:0 4px 16px rgba(23,53,45,.06)}
.card img{width:100%;height:205px;object-fit:cover;display:block;background:#dfe9e4}.pad{padding:15px}.muted{color:var(--muted);font-size:14px}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty .fish{font-size:50px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:7px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:var(--accent2);color:var(--ink);padding:10px 13px}.tab.active{background:var(--accent);color:#fff}
.section{display:none}.section.active{display:block}
.timeline{border-left:2px solid var(--line);margin:10px 0 0 8px;padding-left:15px}.timeline .dot{position:relative}.timeline .dot:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);position:absolute;left:-21px;top:5px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:10;align-items:flex-end}.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:0;max-height:92vh;overflow:hidden;display:flex;flex-direction:column}.sheet-head{position:sticky;top:0;background:#fff;z-index:2;padding:16px 18px 12px;border-bottom:1px solid var(--line)}.sheet-body{padding:14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}.sheet-footer{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}.sheet-footer button{flex:1}
label{font-weight:700;display:block;margin:13px 0 6px}input,textarea,select{font:inherit;font-size:16px;width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}textarea{min-height:90px}
.note{font-size:13px;color:var(--muted);line-height:1.4}.photo-preview{width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:#eef3f0;margin-top:10px;display:none}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{margin-bottom:12px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--accent2);border-radius:14px;padding:12px}.stat b{font-size:20px}.stat small{display:block;color:var(--muted)}
.compare-wrap{position:relative;overflow:hidden;border-radius:18px;background:#dfe9e4;aspect-ratio:4/3}
.compare-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare-top{clip-path:inset(0 50% 0 0)}
.compare-line{position:absolute;top:0;bottom:0;width:2px;background:white;left:50%;box-shadow:0 0 0 1px #0002}
.range{width:100%;margin-top:12px}
.install{background:#fff7d8;border:1px solid #ead995;padding:12px;border-radius:14px;margin:0 0 14px}
</style>
</head>
<body>
<header><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px"><div><h1>🌿 AquaLeafLife</h1><div class="sub">Your private aquarium journal</div></div><div style="font-size:12px;color:#c8dbd4;padding-bottom:4px">v0.6</div></div></header>
<main id="app"></main>
<div class="modal" id="modal" onclick="modalBackdrop(event)"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="row"><h2 id="modalTitle">Add</h2><button class="secondary" type="button" onclick="closeModal()">Close</button></div></div><div id="modalBody" class="sheet-body"></div></div></div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
const KEY="aqualeaflife.prototype03";
const IDB_NAME="AquaLeafLifeDB";
const IDB_STORE="app";
let db={tanks:[]}, currentId=null, activeTab="overview";

const today=()=>new Date().toISOString().slice(0,10);

function openDB(){
 return new Promise((resolve,reject)=>{
   const req=indexedDB.open(IDB_NAME,1);
   req.onupgradeneeded=()=> {
     const idb=req.result;
     if(!idb.objectStoreNames.contains(IDB_STORE)) idb.createObjectStore(IDB_STORE);
   };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);
 });
}
async function idbGet(key){
 const idb=await openDB();
 return new Promise((resolve,reject)=>{
   const tx=idb.transaction(IDB_STORE,"readonly");
   const req=tx.objectStore(IDB_STORE).get(key);
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);
 });
}
async function idbSet(key,value){
 const idb=await openDB();
 return new Promise((resolve,reject)=>{
   const tx=idb.transaction(IDB_STORE,"readwrite");
   tx.objectStore(IDB_STORE).put(value,key);
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>reject(tx.error);
 });
}
async function save(){ await idbSet("db",db); }

async function loadApp(){
 try{
   const stored=await idbGet("db");
   if(stored){
     db=stored;
   }else{
     const legacy=localStorage.getItem(KEY);
     if(legacy){
       db=JSON.parse(legacy);
       await save();
     }
   }
 }catch(e){
   console.error("Storage load failed",e);
   const legacy=localStorage.getItem(KEY);
   if(legacy) db=JSON.parse(legacy);
 }
 renderHome();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function modal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").style.display="flex"}
function closeModal(){chosenPhotoFile=null;chosenRecordPhoto=null;document.getElementById("modal").style.display="none"}function modalBackdrop(e){if(e.target&&e.target.id==="modal")closeModal()}
function tank(){return db.tanks.find(t=>t.id===currentId)}
function standalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true}
function renderHome(){
document.getElementById("app").innerHTML=`${standalone()?'':`<div class="install"><b>Install on iPhone:</b> open in Safari → Share → Add to Home Screen → turn on <b>Open as Web App</b>.</div>`}
<div class="top"><h2>My Tanks</h2><button onclick="addTank()">＋ Add Tank</button></div><div class="actions" style="margin-top:-4px;margin-bottom:14px"><button class="secondary" onclick="backupApp()">⬇️ Backup</button><button class="secondary" onclick="restoreApp()">⬆️ Restore</button></div>
${db.tanks.length?db.tanks.map(t=>`<div class="card" onclick="openTank('${t.id}')">${t.photos.length?`<img src="${t.photos[t.photos.length-1].data}" alt="">`:''}<div class="pad"><h2>${esc(t.name)}</h2><div class="muted">${esc(t.type)}${t.volume?' · '+esc(t.volume)+' gal':''}</div><div class="muted">${t.photos.length} photos · ${t.plants.length} plants · ${t.fish.length} livestock records</div></div></div>`).join(""):`<div class="empty"><div class="fish">🐟🌱📸</div><h2>Start your tank journey</h2><p>Add a tank, then begin photographing how it changes over time.</p><button onclick="addTank()">＋ Add Your First Tank</button></div>`}`;
}
function addTank(){modal("Add Tank",`<label>Tank name</label><input id="tn" placeholder="20 Gallon Long"><label>Type</label><select id="tt"><option>Freshwater</option><option>Patio Pond</option><option>Blackwater</option><option>Saltwater</option><option>Other</option></select><label>Volume (gallons)</label><input id="tv" type="number" placeholder="20"><label>Setup date</label><input id="td" type="date" value="${today()}"><label>Notes</label><textarea id="tno" placeholder="Aquascape, goals, livestock..."></textarea><div class="actions"><button onclick="createTank()">Create Tank</button></div>`)}
async function createTank(){const t={id:crypto.randomUUID(),name:document.getElementById("tn").value.trim()||"Unnamed Tank",type:document.getElementById("tt").value,volume:document.getElementById("tv").value,setup:document.getElementById("td").value,notes:document.getElementById("tno").value,photos:[],plants:[],fish:[],water:[],maintenance:[]};db.tanks.push(t);await save();closeModal();activeTab="overview";openTank(t.id,"overview")}
function openTank(id,tabName=activeTab){currentId=id;activeTab=tabName||"overview";const t=tank();document.getElementById("app").innerHTML=`
<button class="secondary back" onclick="renderHome()">← My Tanks</button>
<div class="top"><div><h2>${esc(t.name)}</h2><div class="muted">${esc(t.type)}${t.volume?' · '+esc(t.volume)+' gal':''}</div></div><button onclick="addPhoto()">📷 Add Photo</button></div>
<div class="statgrid"><div class="stat"><b>${t.photos.length}</b><small>Photos</small></div><div class="stat"><b>${t.plants.length}</b><small>Plants</small></div><div class="stat"><b>${t.fish.length}</b><small>Livestock</small></div></div>
<div class="tabs">${["Overview","Photos","Compare","Plants","Fish","Water","Maintenance"].map(x=>`<button class="tab ${activeTab===x.toLowerCase()?'active':''}" onclick="section('${x.toLowerCase()}',this)">${x}</button>`).join("")}</div>
<div id="overview" class="section ${activeTab==="overview"?"active":""}"><div class="card"><div class="pad"><h3>Tank Journey</h3><p>${esc(t.notes)||"No notes yet."}</p><div class="muted">Setup: ${esc(t.setup||"Not recorded")}</div></div></div>${t.photos.length?`<div class="card"><img src="${t.photos[t.photos.length-1].data}"><div class="pad"><b>Latest Progress Photo</b><div class="muted">${esc(t.photos[t.photos.length-1].date)}</div></div></div>`:`<div class="empty"><p>No progress photos yet.</p><button onclick="addPhoto()">📷 Take the First One</button></div>`}</div>
<div id="photos" class="section ${activeTab==="photos"?"active":""}"><div class="row"><h3>Progress Photos</h3><button onclick="addPhoto()">＋ Photo</button></div>${t.photos.length?`<div class="timeline">${t.photos.slice().reverse().map(p=>`<div class="dot" style="margin-bottom:18px"><b>${esc(p.date)}</b><img src="${p.data}" style="width:100%;border-radius:14px;margin-top:7px">${p.note?`<div class="muted">${esc(p.note)}</div>`:""}</div>`).join("")}</div>`:"<p class='muted'>Your timeline will appear here.</p>"}</div>
<div id="compare" class="section ${activeTab==="compare"?"active":""}">${compareHTML(t)}</div>
<div id="plants" class="section ${activeTab==="plants"?"active":""}"><div class="row"><h3>Plants</h3><button onclick="addRecord('plants','Plant')">＋ Add</button></div>${records(t.plants,"plants")}</div>
<div id="fish" class="section ${activeTab==="fish"?"active":""}"><div class="row"><h3>Livestock</h3><button onclick="addRecord('fish','Fish / Livestock')">＋ Add</button></div>${records(t.fish,"fish")}</div>
<div id="water" class="section ${activeTab==="water"?"active":""}"><div class="row"><h3>Water Parameters</h3><button onclick="addWater()">＋ Test</button></div>${t.water.map((w,i)=>({w,i})).slice().reverse().map(({w,i})=>`<div class="card"><div class="pad"><b>${esc(w.date)}</b><div class="muted">pH ${esc(w.ph||"—")} · Temp ${esc(w.temp||"—")}°F · KH ${esc(w.kh||"—")} · GH ${esc(w.gh||"—")} · NO₃ ${esc(w.no3||"—")}</div><div class="actions"><button class="danger" onclick="deleteWaterEntry(${i})">Delete</button></div></div></div>`).join("")||"<p class='muted'>No water tests yet.</p>"}</div>
<div id="maintenance" class="section ${activeTab==="maintenance"?"active":""}"><div class="row"><h3>Maintenance</h3><button onclick="addMaintenance()">＋ Log</button></div>${t.maintenance.map((m,i)=>({m,i})).slice().reverse().map(({m,i})=>`<div class="card"><div class="pad"><b>${esc(m.date)} · ${esc(m.type)}</b><p>${esc(m.note)}</p><div class="actions"><button class="danger" onclick="deleteMaintenanceEntry(${i})">Delete</button></div></div></div>`).join("")||"<p class='muted'>No maintenance logged yet.</p>"}</div>
<div class="actions"><button class="danger" onclick="deleteTank()">Delete Tank</button></div>`}
function compareHTML(t){if(t.photos.length<2)return `<div class="empty"><h3>Before / After</h3><p>Add at least two progress photos to compare growth.</p></div>`;const a=t.photos[0],b=t.photos[t.photos.length-1];return `<h3>Before / After</h3><div class="muted">${esc(a.date)} → ${esc(b.date)}</div><div class="card"><div class="pad"><div class="compare-wrap" id="compareWrap"><img src="${a.data}"><img id="compareTop" class="compare-top" src="${b.data}"><div id="compareLine" class="compare-line"></div></div><input class="range" type="range" min="0" max="100" value="50" oninput="moveCompare(this.value)"><div class="muted">Drag the slider to reveal the newer photo.</div></div></div>`}
function moveCompare(v){const top=document.getElementById("compareTop"),line=document.getElementById("compareLine");if(top)top.style.clipPath=`inset(0 ${100-v}% 0 0)`;if(line)line.style.left=v+"%"}
function records(a,key){
 return a.length?a.map((x,i)=>`<div class="card">${x.photo?`<img src="${x.photo}" alt="">`:""}<div class="pad">
 <b>${esc(x.name)}</b>
 ${key==="fish"&&x.count?`<div class="muted">Quantity: ${esc(x.count)}</div>`:""}
 ${key==="plants"?`<div class="muted">${(x.growthPhotos||[]).length+(x.photo?1:0)} growth photo${((x.growthPhotos||[]).length+(x.photo?1:0))===1?"":"s"}</div>`:""}
 <p class="muted">${esc(x.note||"")}</p>
 <div class="actions">
   <button class="secondary" onclick="openRecordDetail('${key}',${i})">View Details</button>
   <button class="secondary" onclick="editRecord('${key}',${i})">Edit</button>
   <button class="danger" onclick="deleteRecord('${key}',${i})">Delete</button>
   ${key==="plants"?`<button onclick="addPlantGrowthPhoto(${i})">📷 Add Growth Photo</button><button class="secondary" onclick="comparePlant(${i})">Before / After</button>`:""}
 </div>
 </div></div>`).join(""):"<p class='muted'>Nothing recorded yet.</p>"
}
function section(id,b){activeTab=id;document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active")}

async function prepareImageForJournal(file,maxDim=1400,quality=.72){
 return new Promise((resolve,reject)=>{
   const img=new Image();
   const url=URL.createObjectURL(file);
   img.onload=()=>{
     try{
       let w=img.naturalWidth,h=img.naturalHeight;
       const scale=Math.min(1,maxDim/Math.max(w,h));
       w=Math.max(1,Math.round(w*scale));
       h=Math.max(1,Math.round(h*scale));
       const canvas=document.createElement("canvas");
       canvas.width=w; canvas.height=h;
       const ctx=canvas.getContext("2d");
       ctx.drawImage(img,0,0,w,h);
       URL.revokeObjectURL(url);
       const data=canvas.toDataURL("image/jpeg",quality);
       resolve(data);
     }catch(e){
       URL.revokeObjectURL(url);
       reject(e);
     }
   };
   img.onerror=()=>{
     URL.revokeObjectURL(url);
     reject(new Error("This photo format could not be decoded by Safari."));
   };
   img.src=url;
 });
}
function storageFriendlyError(err){
 console.error(err);
 if(err && (err.name==="QuotaExceededError" || String(err).includes("quota"))){
   return "AquaLeafLife's current prototype storage is full. I can upgrade the next version to a larger on-device photo database.";
 }
 return "AquaLeafLife couldn't save that photo. Try choosing it again.";
}

function addPhoto(){modal("Add Progress Photo",`
<div class="actions" style="margin-top:0;margin-bottom:8px">
<button type="button" onclick="document.getElementById('cameraInput').click()">📷 Take Photo</button>
<button type="button" class="secondary" onclick="document.getElementById('libraryInput').click()">🖼️ Choose from Library</button>
</div>
<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="photoChosen(this)">
<input id="libraryInput" type="file" accept="image/*" style="display:none" onchange="photoChosen(this)">
<div id="selectedPhoto" class="muted">No photo selected yet.</div>
<img id="photoPreview" class="photo-preview" alt="Selected photo preview">
<label>Date</label><input id="pd" type="date" value="${today()}">
<label>What changed?</label><textarea id="pn" placeholder="Trimmed plants, added fish, changed lighting..."></textarea>
<p class="note">The photo stays in AquaLeafLife's local browser storage for this prototype.</p>
<div class="sheet-footer">
<button type="button" class="secondary" onclick="closeModal()">Cancel</button>
<button type="button" id="savePhotoBtn" onclick="savePhoto()">Save Photo</button>
</div>`)}
let chosenPhotoFile=null;
function photoChosen(input){
 const f=input.files&&input.files[0];
 if(!f)return;
 chosenPhotoFile=f;
 const status=document.getElementById("selectedPhoto");
 if(status)status.textContent="Selected: "+(f.name||"Photo");
 const preview=document.getElementById("photoPreview");
 if(preview){
   const u=URL.createObjectURL(f);
   preview.src=u;
   preview.style.display="block";
   preview.onload=()=>URL.revokeObjectURL(u);
 }
 if(f.lastModified){
   const d=new Date(f.lastModified);
   if(!Number.isNaN(d.getTime())){
     const local=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
     const dateField=document.getElementById("pd");
     if(dateField)dateField.value=local;
   }
 }
}
async function savePhoto(){
 const f=chosenPhotoFile;
 if(!f){alert("Choose a photo or take one first.");return;}
 const btn=document.getElementById("savePhotoBtn");
 if(btn){btn.disabled=true;btn.textContent="Preparing photo…";}
 try{
   const imageData=await prepareImageForJournal(f,1400,.72);
   if(btn)btn.textContent="Saving…";
   const rec={data:imageData,date:document.getElementById("pd").value,note:document.getElementById("pn").value};
   tank().photos.push(rec);
   try{
     await save();
   }catch(e){
     tank().photos.pop();
     throw e;
   }
   chosenPhotoFile=null;
   closeModal();
   openTank(currentId,"photos");
 }catch(err){
   if(btn){btn.disabled=false;btn.textContent="Save Photo";}
   alert(storageFriendlyError(err));
 }
}
function addRecord(key,label){
 const isFish=key==="fish";
 modal("Add "+label,`
 <label>Name / species</label>
 <input id="rn" placeholder="${isFish?"Chili Rasbora":"Hydrocotyle tripartita"}">
 ${isFish?`<label>Quantity</label><input id="rc" type="number" min="1" step="1" placeholder="1">`:""}
 <label>${isFish?"Fish photo":"Plant photo"} (optional)</label>
 <div class="actions">
   <button class="secondary" onclick="document.getElementById('recordPhoto').click()">🖼️ Choose Photo</button>
 </div>
 <input id="recordPhoto" type="file" accept="image/*" style="display:none" onchange="recordPhotoChosen(this)">
 <div id="recordPhotoName" class="muted">No photo selected.</div>
 <label>Notes</label><textarea id="ro"></textarea>
 <div class="actions"><button onclick="saveRecord('${key}')">Save</button></div>`)
}
let chosenRecordPhoto=null;
function recordPhotoChosen(input){
 const f=input.files&&input.files[0];
 if(!f)return;
 chosenRecordPhoto=f;
 document.getElementById("recordPhotoName").textContent="Selected: "+f.name;
}
async function saveRecord(key){
 const n=document.getElementById("rn").value.trim();
 if(!n)return alert("Enter a name or species first.");
 const saveButton=document.querySelector("#modalBody .sheet-footer button:last-child, #modalBody .actions button:last-child");
 if(saveButton){saveButton.disabled=true;saveButton.textContent="Saving…";}
 try{
   let photoData=null;
   if(chosenRecordPhoto){
     if(saveButton)saveButton.textContent="Preparing photo…";
     photoData=await prepareImageForJournal(chosenRecordPhoto,1200,.70);
   }
   const rec={name:n,note:document.getElementById("ro").value,photo:photoData};
   if(key==="fish")rec.count=document.getElementById("rc").value||"1";
   tank()[key].push(rec);
   try{
     await save();
   }catch(e){
     tank()[key].pop();
     throw e;
   }
   chosenRecordPhoto=null;
   closeModal();
   openTank(currentId,key);
 }catch(err){
   if(saveButton){saveButton.disabled=false;saveButton.textContent="Save";}
   alert(storageFriendlyError(err));
 }
}

let plantGrowthIndex=null, chosenPlantGrowthPhoto=null;
function addPlantGrowthPhoto(i){
 plantGrowthIndex=i;
 chosenPlantGrowthPhoto=null;
 modal("Add Plant Growth Photo",`
 <div class="actions"><button type="button" class="secondary" onclick="document.getElementById('plantGrowthInput').click()">🖼️ Choose Photo</button></div>
 <input id="plantGrowthInput" type="file" accept="image/*" style="display:none" onchange="plantGrowthChosen(this)">
 <div id="plantGrowthStatus" class="muted">No photo selected.</div>
 <img id="plantGrowthPreview" class="photo-preview" alt="Plant growth photo">
 <label>Date</label><input id="plantGrowthDate" type="date" value="${today()}">
 <label>Notes</label><textarea id="plantGrowthNote" placeholder="New leaves, carpeting progress, trimming, color change..."></textarea>
 <div class="sheet-footer"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button id="plantGrowthSave" type="button" onclick="savePlantGrowthPhoto()">Save Photo</button></div>`)
}
function plantGrowthChosen(input){
 const f=input.files&&input.files[0]; if(!f)return;
 chosenPlantGrowthPhoto=f;
 document.getElementById("plantGrowthStatus").textContent="Selected: "+(f.name||"Photo");
 const p=document.getElementById("plantGrowthPreview"),u=URL.createObjectURL(f);
 p.src=u;p.style.display="block";p.onload=()=>URL.revokeObjectURL(u);
}
async async function savePlantGrowthPhoto(){
 if(!chosenPlantGrowthPhoto)return alert("Choose a photo first.");
 const b=document.getElementById("plantGrowthSave");
 b.disabled=true;b.textContent="Preparing photo…";
 try{
   const data=await prepareImageForJournal(chosenPlantGrowthPhoto,1200,.70);
   const p=tank().plants[plantGrowthIndex];
   if(!p.growthPhotos)p.growthPhotos=[];
   p.growthPhotos.push({data,date:document.getElementById("plantGrowthDate").value,note:document.getElementById("plantGrowthNote").value});
   try{await save()}catch(e){p.growthPhotos.pop();throw e}
   chosenPlantGrowthPhoto=null;closeModal();openTank(currentId,"plants");
 }catch(e){b.disabled=false;b.textContent="Save Photo";alert(storageFriendlyError(e))}
}
function comparePlant(i){
 const p=tank().plants[i], photos=[];
 if(p.photo)photos.push({data:p.photo,date:p.addedDate||"Original"});
 (p.growthPhotos||[]).forEach(x=>photos.push(x));

 if(photos.length<2)return alert("Add at least one growth photo after the original plant photo to compare.");

 photos.sort((a,b)=>{
   const da=Date.parse(a.date||"");
   const db=Date.parse(b.date||"");
   if(Number.isNaN(da)&&Number.isNaN(db))return 0;
   if(Number.isNaN(da))return -1;
   if(Number.isNaN(db))return 1;
   return da-db;
 });

 const a=photos[0], b=photos[photos.length-1];
 const beforeDate=esc(a.date||"Older photo");
 const afterDate=esc(b.date||"Newer photo");

 modal(p.name+" Growth",`
 <div class="card"><div class="pad">
 <div class="row" style="margin-bottom:10px">
   <div><b>Before</b><div class="muted">${beforeDate}</div></div>
   <div style="text-align:right"><b>After</b><div class="muted">${afterDate}</div></div>
 </div>
 <div class="compare-wrap">
   <img src="${a.data}" alt="Before">
   <img id="plantCompareTop" class="compare-top" src="${b.data}" alt="After">
   <div id="plantCompareLine" class="compare-line"></div>
 </div>
 <input class="range" type="range" min="0" max="100" value="50" oninput="movePlantCompare(this.value)">
 <div class="row"><span class="muted">← Before</span><span class="muted">After →</span></div>
 </div></div>
 <div class="sheet-footer"><button type="button" class="secondary" onclick="closeModal()">Done</button></div>`)
}
function movePlantCompare(v){
 const top=document.getElementById("plantCompareTop"),line=document.getElementById("plantCompareLine");
 if(top)top.style.clipPath=`inset(0 ${100-v}% 0 0)`;
 if(line)line.style.left=v+"%";
}


function openRecordDetail(key,i){
 const r=tank()[key][i];
 const isFish=key==="fish";
 modal(r.name,`
 ${r.photo?`<img src="${r.photo}" style="width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:#eef3f0">`:""}
 ${isFish&&r.count?`<p><b>Quantity:</b> ${esc(r.count)}</p>`:""}
 <p>${esc(r.note||"No notes yet.")}</p>
 ${key==="plants"&&r.growthPhotos&&r.growthPhotos.length?`<h3>Growth History</h3>${r.growthPhotos.slice().sort((a,b)=>Date.parse(a.date||"")-Date.parse(b.date||"")).map(g=>`<div class="card"><img src="${g.data}"><div class="pad"><b>${esc(g.date||"Undated")}</b><div class="muted">${esc(g.note||"")}</div></div></div>`).join("")}`:""}
 <div class="sheet-footer"><button type="button" class="secondary" onclick="closeModal()">Done</button></div>`)
}
function editRecord(key,i){
 const r=tank()[key][i], isFish=key==="fish";
 modal("Edit "+(isFish?"Livestock":"Plant"),`
 <label>Name / species</label><input id="editName" value="${esc(r.name)}">
 ${isFish?`<label>Quantity</label><input id="editCount" type="number" min="1" value="${esc(r.count||1)}">`:""}
 <label>Notes</label><textarea id="editNote">${esc(r.note||"")}</textarea>
 <div class="sheet-footer">
   <button type="button" class="secondary" onclick="closeModal()">Cancel</button>
   <button type="button" onclick="saveEditedRecord('${key}',${i})">Save Changes</button>
 </div>`)
}
async function saveEditedRecord(key,i){
 const r=tank()[key][i];
 r.name=document.getElementById("editName").value.trim()||r.name;
 r.note=document.getElementById("editNote").value;
 if(key==="fish")r.count=document.getElementById("editCount").value||"1";
 await save();closeModal();openTank(currentId,key)
}
async function deleteRecord(key,i){
 if(!confirm("Delete this "+(key==="fish"?"livestock":"plant")+" entry?"))return;
 tank()[key].splice(i,1);await save();openTank(currentId,key)
}
async function deleteWaterEntry(i){
 if(!confirm("Delete this water test?"))return;
 tank().water.splice(i,1);await save();openTank(currentId,"water")
}
async function deleteMaintenanceEntry(i){
 if(!confirm("Delete this maintenance entry?"))return;
 tank().maintenance.splice(i,1);await save();openTank(currentId,"maintenance")
}
function backupApp(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="AquaLeafLife-backup-"+today()+".json";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function restoreApp(){
 modal("Restore Backup",`
 <p class="note">Choose an AquaLeafLife JSON backup. This replaces the current local journal after confirmation.</p>
 <input id="restoreFile" type="file" accept=".json,application/json">
 <div class="sheet-footer">
  <button type="button" class="secondary" onclick="closeModal()">Cancel</button>
  <button type="button" onclick="doRestore()">Restore</button>
 </div>`)
}
async function doRestore(){
 const f=document.getElementById("restoreFile").files[0];
 if(!f)return alert("Choose a backup file first.");
 if(!confirm("Replace the current AquaLeafLife journal with this backup?"))return;
 try{
   const txt=await f.text();
   const obj=JSON.parse(txt);
   if(!obj || !Array.isArray(obj.tanks))throw new Error("Invalid backup");
   db=obj;await save();closeModal();renderHome();
 }catch(e){alert("That file does not look like a valid AquaLeafLife backup.");}
}

function addWater(){modal("Water Test",`<label>Date</label><input id="wd" type="date" value="${today()}"><label>pH</label><input id="ph" type="number" step=".1"><label>Temperature °F</label><input id="wt" type="number" step=".1"><label>KH</label><input id="kh" type="number" step=".1"><label>GH</label><input id="gh" type="number" step=".1"><label>Nitrate (ppm)</label><input id="no3" type="number" step=".1"><div class="actions"><button onclick="saveWater()">Save Test</button></div>`)}
async function saveWater(){const g=id=>document.getElementById(id).value;tank().water.push({date:g("wd"),ph:g("ph"),temp:g("wt"),kh:g("kh"),gh:g("gh"),no3:g("no3")});await save();closeModal();openTank(currentId,"water")}
function addMaintenance(){modal("Log Maintenance",`<label>Date</label><input id="md" type="date" value="${today()}"><label>Type</label><select id="mt"><option>Water change</option><option>Plant trimming</option><option>Filter cleaning</option><option>Fertilizer</option><option>CO₂ adjustment</option><option>Livestock added</option><option>Other</option></select><label>Notes</label><textarea id="mn"></textarea><div class="actions"><button onclick="saveMaintenance()">Save</button></div>`)}
async function saveMaintenance(){tank().maintenance.push({date:document.getElementById("md").value,type:document.getElementById("mt").value,note:document.getElementById("mn").value});await save();closeModal();openTank(currentId,"maintenance")}
async function deleteTank(){if(confirm("Delete this tank and all its prototype data?")){db.tanks=db.tanks.filter(x=>x.id!==currentId);await save();renderHome()}}
loadApp();
</script>
